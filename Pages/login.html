<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chill App</title>
    <link rel="favicon" href="../Images/movie-open.png" type="Images/x-icon"/>
    <link rel="stylesheet" href="../Styles/authentication.css" />
</head>
<body>
    <main><img src="../Images/Logo.png" alt="Chilz App Logo"/>
        <div class="header">
            <h1>Masuk</h1>
            <p>Selamat Datang Kembali!</p>
        </div>
    <form action="" method="post">
        <div class="form-group">
        <label classname="form-name" for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Masukan username" required/>
    </div>
    <div class="form-group">
        <label for="password">Password</label>
        <input type="text" id="password" name="password placeholder="Masukan kata sandi" required/>
        <img src="../Images/eye-off.png" alt="Eye Icon"/>
        <p>Belum punya akun? <a href="./register.html">Daftar di sini</a></p>
        <p><a href="#">Lupa kata sandi?</a></p>
        </div>
        <button type="submit">Masuk</button>
        <p>Atau</p>
        <button type="button">
            <img src="../Images/google.png" alt="Google Icon"/>Masuk dengan Google</button>
    </form></main>
</body>
</html>
